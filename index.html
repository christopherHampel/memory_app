<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <section>
        <aside>
          <h3>It's play time.</h3>
          <h1>Ready to play?</h1>
        </aside>
        <button class="primary_btn">
          <img
            class="primary_btn__controller"
            src="/img/stadia_controller_small.png"
            alt="Stadia_Controller_Image"
          />
          <span class="primary_btn__text">Play</span>
          <span class="primary_btn__arrow" aria-hidden="true">
            <img
              class="primary_btn__arrow--default"
              src="/img/arrow_right.png"
              alt=""
            />
            <img
              class="primary_btn__arrow--hover"
              src="/img/arrow_right_hover.png"
              alt=""
            />
          </span>
        </button>
        <figure>
          <img src="/img/stadia_controller.png" alt="Stadia_Controller_Image" />
        </figure>
      </section>
    </main>
  </body>
</html>
