<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>

    <script type="module" src="../ts/settings.ts"></script>
  </head>
  <body>
    <main class="settings">
      <header class="settings__header">
          <div class="settings__headline-wrapper">
            <h2 class="settings__headline">Settings</h2>
            <div class="showline"></div>
          </div>
      </header>
      <div class="settings__container">
        <section class="settings__controls">
          <fieldset class="settings__fieldset">
            <legend class="settings__legend">
              <img
                src="/img/palette.png"
                alt="Palette Icon"
                class="settings__legend-icon"
              />
              <span>Game themes</span>
            </legend>
            <div class="settings__options">
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="gameTheme" value="code-vibes" />
                  <span>Code vibes theme</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="gameTheme" value="gaming" />
                  <span>Gaming theme</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="gameTheme" value="da-projects" />
                  <span>DA Projects theme</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="gameTheme" value="foods" />
                  <span>Foods theme</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
            </div>
          </fieldset>

          <fieldset class="settings__fieldset">
            <legend class="settings__legend">
              <img
                src="/img/chess_pawn.png"
                alt="Chess Pawn Icon"
                class="settings__legend-icon"
              />
              <span>Choose Player</span>
            </legend>
            <div class="settings__options">
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="playerColor" value="blue" />
                  <span>Blue</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="playerColor" value="orange" />
                  <span>Orange</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
            </div>
          </fieldset>

          <fieldset class="settings__fieldset">
            <legend class="settings__legend">
              <img
                src="/img/bounding_box.png"
                alt="Smart Display Icon"
                class="settings__legend-icon"
              />
              <span>Board size</span>
            </legend>
            <div class="settings__options">
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="boardSize" value="16" />
                  <span>16 cards</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="boardSize" value="24" />
                  <span>24 cards</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
              <div class="settings__radio-wrapper">
                <label class="settings__radio-option">
                  <input type="radio" name="boardSize" value="36" />
                  <span>36 cards</span>
                </label>
                <div class="showline showline--right"></div>
              </div>
            </div>
          </fieldset>
        </section>
        <section class="settings__preview">
          <figure class="settings__preview-image">
            <img src="/img/Theme Visual.png" alt="Theme Vorschau" />
          </figure>

          <div class="settings__preview-info">
            <div class="settings__preview-item">
              <span>Game theme</span>
            </div>
            <div class="settings__dividing-line">
              <span></span>
            </div>
            <div class="settings__preview-item">
              <span>Player</span>
            </div>
            <div class="settings__dividing-line">
              <span></span>
            </div>
            <div class="settings__preview-item">
              <span>Board size</span>
            </div>
            <button class="primary_btn">
              <img src="/img/smart_display.png" alt="Smart_display" />Start
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
