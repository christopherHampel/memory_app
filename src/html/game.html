<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game</title>
    <script type="module" src="../ts/game.ts"></script>
  </head>
  <body>
    <main>
      <nav class="game-nav">
        <div class="game-nav__player game-nav__player--left">
          <img id="player1-img" src="" alt="Player 1" />
          <span id="player1-name">Player 1</span>
        </div>
        <div class="game-nav__current">
          <span id="current-player">Current Player</span>
        </div>
        <div class="game-nav__actions">
          <button id="exit-game" class="game-nav__exit-btn">Exit Game</button>
        </div>
        <!-- <div class="game-nav__player game-nav__player--right">
          <img id="player2-img" src="" alt="Player 2" />
          <span id="player2-name">Player 2</span>
        </div> -->
      </nav>
      <main class="game-main" id="game-field"></main>
    </main>
  </body>
</html>
